name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/ci --config Release --parallel 2
      - name: Test profiles
        run: ctest --test-dir build/ci -C Release --output-on-failure --output-junit test-results.xml
      - name: Report test results
        if: always()
        shell: python
        run: |
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          results = Path('build/ci/test-results.xml')
          if results.exists():
              suite = ET.parse(results).getroot()
              lines = ['## Profile tests', '', '| Test | Result |', '| --- | --- |']
              for case in suite.iter('testcase'):
                  failed = case.find('failure') is not None or case.find('error') is not None
                  skipped = case.find('skipped') is not None
                  outcome = 'Failed' if failed else 'Skipped' if skipped else 'Passed'
                  lines.append(f"| {case.get('name')} | {outcome} |")
                  if failed:
                      output = case.findtext('system-out', '')
                      details = '\n'.join(node.text or '' for node in case if node.tag in ('failure', 'error'))
                      message = (details + '\n' + output)[:6000]
                      message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f"::error title={case.get('name')}::{message}")
              with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
                  summary.write('\n'.join(lines) + '\n')
      - name: Collect Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/CS2Profiles
          Copy-Item build/ci/Release/cs2_profiles.exe artifacts/CS2Profiles/
          Copy-Item README.md artifacts/CS2Profiles/
          Copy-Item build/ci/_deps/imgui-src/LICENSE.txt artifacts/CS2Profiles/IMGUI-LICENSE.txt
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: CS2Profiles-windows-x64
          path: artifacts/CS2Profiles/
          if-no-files-found: error
